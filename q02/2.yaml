apiVersion: apps/v1
kind: Deployment
metadata:
  name: myproject
  annotations:
    kubernetes.io/change-cause: "Initial deployment"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myproject
  template:
    metadata:
      labels:
        app: myproject
    spec:
      containers:
      - name: nginx
        image: nginx:1.16